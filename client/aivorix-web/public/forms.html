<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Aivorix form definitions</title>
</head>
<body>
  <!-- Static definitions let Netlify register Angular's AJAX-submitted forms. -->
  <form name="newsletter" method="POST" data-netlify="true" netlify-honeypot="website">
    <input type="hidden" name="form-name" value="newsletter">
    <input type="hidden" name="subject" value="New Aivorix newsletter subscriber">
    <input name="website">
    <input type="email" name="email">
  </form>
  <form name="contact" method="POST" data-netlify="true" netlify-honeypot="website">
    <input type="hidden" name="form-name" value="contact">
    <input type="hidden" name="subject" value="New Aivorix contact message">
    <input name="website">
    <input name="name">
    <input type="email" name="email">
    <input name="company">
    <textarea name="message"></textarea>
  </form>
</body>
</html>
