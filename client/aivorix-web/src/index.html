<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Aivorix — AI News, Comparisons & Model Guides</title>
    <base href="/">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#f4f2ea">
    <meta name="description" content="Source-backed AI news, model comparisons, pricing notes and practical guides.">
    <meta name="google-site-verification" content="fRYPfVyMTkk2X5kGpnDn92hkZfWZUSI91Txe0HHWajs" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://openai.com">
    <link rel="preconnect" href="https://www.anthropic.com">
</head>

<body>
    <!-- Netlify scans this static HTML at deploy time. The visible Angular forms
         submit the same field names and show their own inline status messages. -->
    <form name="newsletter" method="POST" data-netlify="true" netlify-honeypot="website" hidden>
        <input type="hidden" name="form-name" value="newsletter">
        <input type="hidden" name="subject" value="New Aivorix newsletter subscriber">
        <input name="website">
        <input type="email" name="email">
    </form>
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="website" hidden>
        <input type="hidden" name="form-name" value="contact">
        <input type="hidden" name="subject" value="New Aivorix contact message">
        <input name="website">
        <input name="name">
        <input type="email" name="email">
        <input name="company">
        <textarea name="message"></textarea>
    </form>
    <app-root></app-root>
</body>

</html>
